name: 缺陷报告
description: 报告一个可以复现的缺陷
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Scenecaps。请尽量提供可复现、可核实的信息。
        提交前请先搜索现有 Issue，避免重复报告。

  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 简要描述发生了什么，以及你预期应该发生什么。
      placeholder: 发生了什么？你以为会发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供可以稳定复现问题的最少步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: Scenecaps 的版本或提交哈希。
      placeholder: 例如 1.0.0 或 75d0904
    validations:
      required: true

  - type: input
    id: engine-version
    attributes:
      label: 引擎版本
      description: 使用的 Unreal Engine 版本。
      placeholder: 例如 5.8.0
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: 构建目标
      description: 出现问题的构建目标。
      options:
        - Editor (Development)
        - Game (Development)
        - Game (Shipping)
        - 其他
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      description: 问题主要涉及的模块。
      options:
        - Runtime 模块（Scenecaps）
        - Editor 模块（ScenecapsEditor）
        - 构建或工具
        - 文档
        - 不确定
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 相关的日志、调用栈或截图。请勿包含敏感信息。
      render: text
    validations:
      required: false

  - type: textarea
    id: ai-usage
    attributes:
      label: AI 使用情况
      description: >-
        如使用 AI 辅助撰写本报告，请说明工具与用途；未使用可填写"未使用"。
        详见 AI 使用方针。
      placeholder: 未使用
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复报告。
          required: true
        - label: 我已确认所描述的问题基于实际观察，而非推测。
          required: true
