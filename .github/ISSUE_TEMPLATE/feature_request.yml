name: 功能建议
description: 提出一个新的功能或改进建议
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请尽量说明使用场景与动机，这有助于判断需求是否成立。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的限制或不便。建议从使用场景出发，而非直接描述实现。
      placeholder: 在使用 ... 时，遇到了 ... 的问题。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 描述你希望的功能或行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或当前的规避方式。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 你估计该建议涉及的范围。
      options:
        - Runtime 模块
        - Editor 模块
        - 构建或工具
        - 文档
        - 不确定
    validations:
      required: true

  - type: textarea
    id: ai-usage
    attributes:
      label: AI 使用情况
      description: >-
        如使用 AI 辅助撰写本建议，请说明工具与用途；未使用可填写"未使用"。
      placeholder: 未使用
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议。
          required: true
        - label: 我理解功能建议不保证被采纳，维护者会结合项目方向判断。
          required: true
