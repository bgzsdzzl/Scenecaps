name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UE_VERSION: "5.8"

jobs:
  # ┌─────────────────────────────────────────────────────────────┐
  # │ 1. 构建验证 - 源码结构 + 引用完整性 + 模块规范                  │
  # └─────────────────────────────────────────────────────────────┘
  build-validation:
    name: Build Validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Module Structure
        shell: pwsh
        run: |
          $errors = @()

          # 关键文件必须存在
          $requiredFiles = @(
            "Scenecaps.uplugin",
            "Source/Scenecaps/Scenecaps.Build.cs",
            "Source/ScenecapsEditor/ScenecapsEditor.Build.cs",
            "Source/Scenecaps/Private/ScenecapsModule.cpp",
            "Source/ScenecapsEditor/Private/ScenecapsEditorModule.cpp"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) { $errors += "Missing: $file" }
          }

          # 模块声明与目录一致性
          $uplugin = Get-Content "Scenecaps.uplugin" -Raw | ConvertFrom-Json
          foreach ($module in $uplugin.Modules) {
            $buildCs = "Source/$($module.Name)/$($module.Name).Build.cs"
            if (-not (Test-Path $buildCs)) { $errors += "Module '$($module.Name)' missing $buildCs" }
          }

          # EngineVersion 必须 5.8
          if ($uplugin.EngineVersion -ne "5.8") {
            $errors += "EngineVersion must be 5.8, got '$($uplugin.EngineVersion)'"
          }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "✅ Module structure valid (Engine 5.8, all modules present)"

      - name: Verify Build.cs Dependencies
        shell: pwsh
        run: |
          $errors = @()
          foreach ($buildCs in Get-ChildItem "Source" -Recurse -Filter "*.Build.cs") {
            $content = Get-Content $buildCs.FullName -Raw
            $moduleName = $buildCs.BaseName -replace '\.Build$',''
            $pattern = 'class\s+' + [regex]::Escape($moduleName) + '\s*:\s*ModuleRules'

            if ($content -notmatch $pattern) {
              $errors += "$($buildCs.Name): class name does not match file name"
            }
            if ($content -notmatch 'PublicDependencyModuleNames') {
              $errors += "$($buildCs.Name): missing PublicDependencyModuleNames"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "✅ All Build.cs files valid"

      - name: Verify Public API Export Macros
        shell: pwsh
        run: |
          # Public/ 头文件中的 UCLASS/USTRUCT 必须带 SCENECAPS_API
          $errors = @()
          foreach ($header in Get-ChildItem "Source/Scenecaps/Public" -Filter "*.h") {
            $content = Get-Content $header.FullName -Raw
            $matches = [regex]::Matches($content, '(UCLASS|USTRUCT)\([^)]*\)\s*(?:\r?\n\s*)?class\s+(SCENECAPS_API\s+)?\w+')
            foreach ($m in $matches) {
              if ($m.Groups[1].Value -notmatch "SCENECAPS_API") {
                $errors += "$($header.Name): UCLASS/USTRUCT missing SCENECAPS_API at offset $($m.Index)"
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Warning $_ }
            Write-Host "⚠️ Some public types missing export macro (warning only)"
          } else {
            Write-Host "✅ All public types export SCENECAPS_API"
          }

      - name: Verify WITH_EDITOR Usage
        shell: pwsh
        run: |
          # 检查常见的编辑器专用 API 是否被 WITH_EDITOR 包裹
          $editorOnlyApis = @(
            "SetActorLabel",
            "GetActorLabel",
            "ClassGeneratedBy",
            "GetTransientPackage",
            "AddDataLayer",
            "RemoveDataLayer",
            "SetIsSpatiallyLoaded"
          )
          $errors = @()
          foreach ($cpp in Get-ChildItem "Source/Scenecaps/Private" -Filter "*.cpp") {
            $lines = Get-Content $cpp.FullName
            for ($i = 0; $i -lt $lines.Count; $i++) {
              foreach ($api in $editorOnlyApis) {
                if ($lines[$i] -match "\.$api\(" -or $lines[$i] -match "->$api\(") {
                  # 检查前后 5 行内是否有 WITH_EDITOR
                  $context = $lines[[Math]::Max(0, $i-5)..[Math]::Min($lines.Count-1, $i+5)] -join "`n"
                  if ($context -notmatch "WITH_EDITOR") {
                    $errors += "$($cpp.Name):$($i+1): '$api' may need WITH_EDITOR guard"
                  }
                }
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Warning $_ }
            Write-Host "⚠️ Potential editor-only API without guard (review recommended)"
          } else {
            Write-Host "✅ Editor-only APIs properly guarded"
          }

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 2. Include 可用性 - 头文件存在于 UE 5.8 或本项目                │
  # └─────────────────────────────────────────────────────────────┘
  include-check:
    name: Include Check (UE 5.8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify All Includes Resolve (UE 5.8 headers manifest)
        shell: pwsh
        run: |
          $manifest = ".github/ue58-headers.txt"
          if (-not (Test-Path $manifest)) {
            Write-Error "Missing UE 5.8 header manifest: $manifest"
            exit 1
          }

          # 已知 UE 5.8 头文件集合（引擎 + 插件 Public/Classes）
          $known = @{}
          Get-Content $manifest | ForEach-Object {
            $line = $_.Trim()
            if ($line -and -not $line.StartsWith("#")) { $known[$line] = $true }
          }
          Write-Host "Loaded $($known.Count) known UE 5.8 headers"

          # 本项目自己的头文件（相对模块根目录，即 include 的解析方式）
          foreach ($header in Get-ChildItem "Source" -Recurse -Include "*.h","*.hpp") {
          $full = $header.FullName -replace '\\', '/'
          if ($full -match '/Source/([^/]+)/(.+)$') {
            $known["$($Matches[2])"] = $true
            $known["$($Matches[1])/$($Matches[2])"] = $true
            # 也加裸文件名（如 "ScenecapsActor.h" 而非 "Public/ScenecapsActor.h"）
            $known[$Matches[2]] = $true
            $known[([System.IO.Path]::GetFileName($full))] = $true
          }
          }
          # Build.cs、generated.h 等动态文件
          $known["*.generated.h"] = $true
          Write-Host "Total known headers (incl. project): $($known.Count)"

          # 扫描所有 #include "..."（尖括号 include 是系统头，跳过）
          $errors = @()
          $checked = 0
          foreach ($src in Get-ChildItem "Source" -Recurse -Include "*.h","*.hpp","*.cpp") {
            $lineNo = 0
            foreach ($line in Get-Content $src.FullName) {
              $lineNo++
              if ($line -match '^\s*#include\s+"([^"]+)"') {
                $inc = $Matches[1]
                $checked++
                # generated.h 由 UHT 生成，跳过
                if ($inc -match '\.generated\.h$') { continue }
                if (-not $known.ContainsKey($inc)) {
                  $errors += "$($src.FullName.Replace((Get-Location).Path + '\', '')):$($lineNo): include not found in UE 5.8 or project: `"$inc`""
                }
              }
            }
          }

          Write-Host "Checked $checked includes"
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            Write-Error "Found $($errors.Count) unresolvable include(s)"
            exit 1
          }
          Write-Host "✅ All $checked includes resolve in UE 5.8 / project headers"

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 3. 代码质量 - 文档/规范                                       │
  # └─────────────────────────────────────────────────────────────┘
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CHANGELOG.md
            CODE_OF_CONDUCT.md
            docs/*.md
        continue-on-error: true

      - name: Verify Docs Links
        shell: pwsh
        run: |
          # 验证文档中的相对链接指向存在的文件
          $errors = @()
          $docs = Get-ChildItem -Recurse -Filter "*.md" | Where-Object { $_.FullName -notmatch "node_modules" }
          foreach ($doc in $docs) {
            $content = Get-Content $doc.FullName -Raw
            $linkMatches = [regex]::Matches($content, '\[[^\]]+\]\((?!http)([^)#\s]+)(?:#[^)]*)?\)')
            foreach ($m in $linkMatches) {
              $linkPath = $m.Groups[1].Value
              $resolved = Join-Path (Split-Path $doc.FullName) $linkPath
              $resolved = [System.IO.Path]::GetFullPath($resolved)
              if (-not (Test-Path $resolved)) {
                $errors += "$($doc.Name): broken link '$linkPath'"
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "✅ All documentation links valid"

      - name: Conventional Commits (PR title check)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $title = "${{ github.event.pull_request.title }}"
          if ($title -notmatch '^(feat|fix|docs|refactor|perf|test|chore|revert|ci)(\(.+\))?!?: .+') {
            Write-Error "PR title must follow conventional commits: 'type(scope): description'. Got: '$title'"
            exit 1
          }
          Write-Host "✅ PR title follows conventional commits"

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 4. 安全 - Secret 扫描 + 依赖审查                               │
  # └─────────────────────────────────────────────────────────────┘
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Secrets & Credentials
        shell: pwsh
        run: |
          # 扫描源文件中意外提交的密钥/令牌/密码
          $patterns = @(
            @{ Name = 'AWS Key';        Regex = 'AKIA[0-9A-Z]{16}' },
            @{ Name = 'GitHub Token';   Regex = 'ghp_[A-Za-z0-9]{36}' },
            @{ Name = 'Generic API Key'; Regex = '(?i)(api[_-]?key|secret|password)\s*[=:]\s*["''][^''"]{8,}["'']' },
            @{ Name = 'Private Key';    Regex = '-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----' }
          )
          $errors = @()
          $files = Get-ChildItem -Recurse -Include "*.h","*.cpp","*.cs","*.csproj","*.json","*.ini","*.uplugin","*.yml","*.yaml","*.py","*.sh","*.ps1","*.bat" |
            Where-Object { $_.FullName -notmatch '(node_modules|\.git\\|\.git/)' }
          foreach ($file in $files) {
            $lineNo = 0
            foreach ($line in Get-Content $file.FullName -ErrorAction SilentlyContinue) {
              $lineNo++
              foreach ($p in $patterns) {
                if ($line -match $p.Regex) {
                  $errors += "$($file.Name):$($lineNo): potential $($p.Name)"
                }
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "✅ No secrets detected in $($files.Count) files"

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 5. 汇总状态 (README badge 用)                                 │
  # └─────────────────────────────────────────────────────────────┘
  status:
    name: CI Status
    needs: [build-validation, include-check, code-quality, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "build-validation: ${{ needs.build-validation.result }}"
          echo "include-check: ${{ needs.include-check.result }}"
          echo "code-quality: ${{ needs.code-quality.result }}"
          echo "security: ${{ needs.security.result }}"
          if [[ "${{ needs.build-validation.result }}" != "success" ]] ||
             [[ "${{ needs.include-check.result }}" != "success" ]] ||
             [[ "${{ needs.code-quality.result }}" != "success" ]] ||
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed 🎉"