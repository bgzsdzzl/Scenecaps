name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Scenecaps"

jobs:
  build:
    name: Build (${{ matrix.config.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Editor Development"
            target: "UnrealEditor"
            config: "Development"
          - name: "Game Development"
            target: "UnrealGame"
            config: "Development"
          - name: "Game Shipping"
            target: "UnrealGame"
            config: "Shipping"
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup UE
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache UE
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/UnrealBuildTool
            ${{ runner.temp }}/UnrealBuildTool
          key: ue-${{ env.UE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.Build.cs', '*.uplugin') }}
          restore-keys: |
            ue-${{ env.UE_VERSION }}-${{ runner.os }}-

      - name: Install UE
        run: |
          $ErrorActionPreference = "Stop"
          $uePath = "C:\UE\UE_5.8"
          if (-not (Test-Path $uePath)) {
            Write-Host "UE not found at $uePath"
            exit 1
          }

      - name: Build Plugin
        run: |
          $ErrorActionPreference = "Stop"
          $uePath = "C:\UE\UE_5.8"
          $projectPath = "BuildOutput/HostProject/HostProject.uproject"
          $pluginPath = "$(Get-Location)/Scenecaps.uplugin"
          $buildOutput = "BuildOutput"
          
          & "$uePath\Engine\Build\BatchFiles\RunUAT.bat" BuildPlugin `
            -Plugin="$pluginPath" `
            -Package="$buildOutput" `
            -TargetPlatforms=Win64 `
            -TargetConfigurations=${{ matrix.config.config }} `
            -Build=${{ matrix.config.target }} `
            -NoHotReload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}-build
          path: BuildOutput/
          retention-days: 7

  static-analysis:
    name: Static Analysis
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Static Analysis (MSBuild)
        run: |
          # Basic static analysis via MSBuild warnings as errors
          # This would need a .props file with <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
          echo "Static analysis placeholder"

  release:
    name: Create Release
    needs: [build, static-analysis]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Editor Development-build/**
            artifacts/Game Development-build/**
            artifacts/Game Shipping-build/**
          generate_release_notes: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true