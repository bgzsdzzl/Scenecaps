name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UE_VERSION: "5.8"

jobs:
  # ┌─────────────────────────────────────────────────────────────┐
  # │ 1. 静态分析 - 核心                                            │
  # └─────────────────────────────────────────────────────────────┘
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔍 MSBuild Static Analysis (TreatWarningsAsErrors)
        shell: pwsh
        run: |
          cd Source/Scenecaps
          msbuild Scenecaps.Build.cs /t:Rebuild /p:Configuration=Development /p:Platform=Win64 /p:WarningLevel=4 /p:TreatWarningsAsErrors=true /v:q /nologo

      - name: 🔍 Clang-Tidy (if available)
        if: runner.os == 'Linux'
        run: |
          find Source -name "*.cpp" -o -name "*.h" | xargs clang-tidy -checks="modernize-*,performance-*,readability-*,bugprone-*" -p=. 2>/dev/null || true

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 2. 代码质量 - 格式/规范/拼写                                   │
  # └─────────────────────────────────────────────────────────────┘
  code-quality:
    name: ✨ Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 📝 Check License Headers
        run: |
          # 验证所有源文件有 Apache 2.0 头
          find Source -name "*.h" -o -name "*.cpp" | xargs grep -L "Apache License" | grep -v "ThirdParty" && exit 1 || true

      - name: 🔤 Spell Check (markdown/docs)
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: "**/*.md"
          config: .github/cspell.json

      - name: 📝 Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          config: .github/markdownlint.json

      - name: 📦 Conventional Commits
        uses: gsactions/commit-message-checker@v3
        with:
          pattern: '^(feat|fix|docs|refactor|perf|test|chore|revert)(\(.+\))?: .+'

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 3. 依赖/安全检查                                              │
  # └─────────────────────────────────────────────────────────────┘
  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔒 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
      
      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"

      - name: 🔒 Dependency Review
        uses: actions/dependency-review-action@v4

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 4. 文档/拼写/格式                                             │
  # └─────────────────────────────────────────────────────────────┘
  docs:
    name: 📚 Docs & Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      
      - name: 📝 Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          config: .github/markdownlint.json
      
      - name: 🔤 Spell Check
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: "**/*.md"
          config: .github/cspell.json

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 5. 构建验证 (语法/语义检查 - 替代编译)                          │
  # └─────────────────────────────────────────────────────────────┘
  build-validation:
    name: 🔨 Build Validation (Syntax & Semantics)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔨 MSBuild Syntax & Semantic Check (Dry Run)
        shell: pwsh
        run: |
          cd Source/Scenecaps
          msbuild Scenecaps.Build.cs /t:Rebuild /p:Configuration=Development /p:Platform=Win64 /p:WarningLevel=4 /p:TreatWarningsAsErrors=true /v:q /nologo /p:GenerateTargetFrameworkAttribute=false /p:GenerateAssemblyInfo=false

      - name: 📦 Verify Module Structure
        shell: pwsh
        run: |
          # 验证关键文件存在
          $requiredFiles = @(
            "Source/Scenecaps/Scenecaps.Build.cs",
            "Source/Scenecaps/Public/ScenecapsModule.h",
            "Source/Scenecaps/Public/ScenecapsAsset.h",
            "Source/Scenecaps/Public/ScenecapsTypes.h",
            "Source/Scenecaps/Private/ScenecapsModule.cpp",
            "Source/Scenecaps/Private/ScenecapsAsset.cpp"
          )
          $missing = @()
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              $missing += $file
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required files: $($missing -join ', ')"
            exit 1
          }
          Write-Host "✅ All required module files present"

      - name: 📦 Verify Build.cs Syntax
        shell: pwsh
        run: |
          $content = Get-Content "Source/Scenecaps/Scenecaps.Build.cs" -Raw
          if ($content -notmatch "PublicDependencyModuleNames") {
            Write-Error "Missing PublicDependencyModuleNames"
            exit 1
          }
          if ($content -notmatch "PrivateDependencyModuleNames") {
            Write-Error "Missing PrivateDependencyModuleNames"
            exit 1
          }
          Write-Host "✅ Build.cs structure valid"

  # ┌─────────────────────────────────────────────────────────────┐
  # │ 6. 汇总状态 (用于 README badge)                                │
  # └─────────────────────────────────────────────────────────────┘
  status:
    name: ✅ Status
    needs: [static-analysis, code-quality, security, docs, build-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📊 Status Summary
        run: |
          echo "All checks passed! 🎉"
          echo "::notice::All CI checks passed ✅"